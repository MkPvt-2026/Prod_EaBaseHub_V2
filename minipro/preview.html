<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ════ แก้ title ตามหน้า ════ -->
  <title>ชื่อหน้า | Executive</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- ════ CSS ════ -->
  <!-- Layout shell (sidebar + header) -->
  <link rel="stylesheet" href="/css/base/role-colors.css">

  <!-- ════ เพิ่ม CSS เฉพาะหน้าตรงนี้ ════ -->
  <link rel="stylesheet" href="/minipro/preview.css">

</head>
<body class="role-admin">

<!-- ════════════════════════════════════════════════
     APP LAYOUT WRAPPER
════════════════════════════════════════════════ -->
<div class="app-layout">

  <!-- ════════════════════════════════════════════════
       SIDEBAR
  ════════════════════════════════════════════════ -->
  <aside class="app-sidebar collapsed" id="appSidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="sidebar-logo-circle">
        <img src="/assets/icons/icon-192.png" alt="EABaseHub logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <span style="display:none">E</span>
      </div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-title">EABaseHub</div>
        <div class="sidebar-brand-sub">Executive Command Center</div>
      </div>
    </div>

    <!-- ════ Navigation — คัดลอก / เพิ่ม item ได้ตามต้องการ ════ -->
    <nav class="sidebar-nav" id="sidebarNav">

      <a href="/pages/executive/executive-Dashboard.html"
         class="sidebar-nav-item"
         title="หน้าหลัก">
        <div class="nav-icon-wrap">
          <span class="material-symbols-outlined">home</span>
        </div>
        <span class="nav-label">หน้าหลัก</span>
      </a>

      <a href="/pages/executive/executiveHome.html"
         class="sidebar-nav-item"
         title="รายงาน">
        <div class="nav-icon-wrap">
          <span class="material-symbols-outlined">assignment</span>
        </div>
        <span class="nav-label">รายงาน</span>
      </a>

      <a href="/pages/executive/executive-Approval.html"
         class="sidebar-nav-item"
         title="ขออนุมัติ">
        <div class="nav-icon-wrap">
          <span class="material-symbols-outlined">approval_delegation</span>
        </div>
        <span class="nav-label">ขออนุมัติ</span>
      </a>

      <!-- ════ เพิ่ม nav item ใหม่ตรงนี้ ════
      <a href="/pages/executive/myNewPage.html"
         class="sidebar-nav-item"
         title="ชื่อเมนู">
        <div class="nav-icon-wrap">
          <span class="material-symbols-outlined">icon_name</span>
        </div>
        <span class="nav-label">ชื่อเมนู</span>
      </a>
      -->

    </nav>

    <!-- Collapse toggle -->
    <div class="sidebar-collapse-btn" title="ย่อ/ขยาย">
      <span class="material-symbols-outlined">chevron_right</span>
    </div>

    <div class="sidebar-divider"></div>

    <!-- Logout -->
    <button class="sidebar-logout" id="logoutBtn" title="ออกจากระบบ">
      <div class="nav-icon-wrap">
        <span class="material-symbols-outlined">logout</span>
      </div>
      <span class="nav-label">ออกจากระบบ</span>
    </button>

  </aside><!-- /.app-sidebar -->


  <!-- ════════════════════════════════════════════════
       MAIN CONTENT
  ════════════════════════════════════════════════ -->
  <div class="app-main">

    <!-- ════════════════════════════════════════════════
         HEADER
    ════════════════════════════════════════════════ -->
    <header class="app-header">

      <!-- Left: System name + subtitle -->
      <div class="header-left">
        <div class="header-system-name">
          <div class="header-icon">
            <!-- ════ เปลี่ยน icon ตามหน้า ════ -->
            <span class="material-symbols-outlined">dashboard</span>
          </div>
          <!-- ════ เปลี่ยนชื่อหน้า ════ -->
          ชื่อหน้า
        </div>
        <!-- ════ เปลี่ยน subtitle ════ -->
        <div class="header-subtitle">คำอธิบายสั้น ๆ ของหน้านี้</div>
      </div>

      <!-- Right: badge + date + user -->
      <div class="header-right">

        <div class="page-header-badge" title="สิทธิ์การใช้งาน">
          <span class="material-symbols-outlined" style="font-size:20px;color:#d97706;">workspace_premium</span>
          <span>Executive</span>
        </div>

        <div class="header-date-pill" id="headerDatePill">
          <span class="material-symbols-outlined">calendar_month</span>
          <span id="headerDateText">—</span>
        </div>

        <div class="header-user">
          <div class="header-user-avatar" id="userAvatar">
            <span class="material-symbols-outlined" style="font-size:16px!important;color:white!important;">person</span>
          </div>
          <span class="header-user-name" id="userName">กำลังโหลด...</span>
        </div>

      </div>
    </header><!-- /.app-header -->


    <!-- ════════════════════════════════════════════════
         BREADCRUMB — แก้ตามหน้า
    ════════════════════════════════════════════════ -->
    <nav class="app-breadcrumb" aria-label="breadcrumb">
      <a href="/pages/executive/executive-Dashboard.html">
        <span class="material-symbols-outlined">home</span>
        หน้าหลัก
      </a>
      <span class="bc-sep">›</span>
      <span class="bc-current">
        <!-- ════ เปลี่ยน icon + ชื่อ ════ -->
        <span class="material-symbols-outlined">dashboard</span>
        ชื่อหน้า
      </span>
    </nav>


    <!-- ════════════════════════════════════════════════
         PAGE CONTENT — ใส่ content ของแต่ละหน้าตรงนี้
    ════════════════════════════════════════════════ -->
    <main class="app-content" id="pageContent">

      <!--
      ╔══════════════════════════════════════════════╗
      ║  📝 วาง HTML content ของหน้านี้ตรงนี้       ║
      ║     เช่น .container > .card > ...           ║
      ╚══════════════════════════════════════════════╝

      ตัวอย่าง:
      <div class="container">
        <div class="card">
          <h2>หัวข้อ</h2>
          <p>เนื้อหา...</p>
        </div>
      </div>
      -->

    </main><!-- /.app-content -->


    <!-- Footer -->
    <footer class="app-footer">© 2026 EABaseHub | Executive</footer>

  </div><!-- /.app-main -->
</div><!-- /.app-layout -->


<!-- Toast notification -->
<div id="toast" class="toast"></div>


<!-- ════════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════════ -->
<!-- Core (ต้องโหลดก่อน sidebar-header.js) -->
<script src="/js/core/supabaseClient.js"></script>
<script src="/js/core/roleConfig.js"></script>
<script src="/js/core/userService.js"></script>
<script src="/js/core/auth.js"></script>

<!-- Sidebar + Header behaviors -->
<!-- <script src="/js/core/sidebar-header.js"></script> -->

<!-- ════ เพิ่ม JS เฉพาะหน้าตรงนี้ ════ -->
<script src="/minipro/preview.js"></script>

</body>
</html>
