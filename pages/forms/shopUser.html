<!doctype html>
<html lang="th">
  <head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding body{visibility:hidden!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>EABaseHub | ร้านของฉัน</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base/layout.css" />
    <link rel="stylesheet" href="/css/pages/forms/shopUser.css" />
    <link rel="stylesheet" href="/css/pages/forms/shopUser-ux.css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
      <link rel="stylesheet" href="/css/base/ui-cards.css" />
  </head>

  <body>

    <header class="app-header ui-role-bar">
      <div class="logo">
        <div class="logo-circle">
          <img src="/assets/icons/icon-192.png" alt="logo">
        </div>
        <h2>EABaseHub</h2>
      </div>
      <div class="user-box">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="userName">กำลังโหลด...</div>
        </div>
        <button id="logoutBtn" class="logout-btn">ออกจากระบบ</button>
      </div>
    </header>

    <nav class="app-nav">
      <a href="/index.html">หน้าแรก</a>
      <a href="/pages/reports/report.html">รายงานเยี่ยมร้านค้า</a>
      <a href="/pages/forms/formClaim.html">แจ้งเคลมสินค้า</a>
      <a href="/pages/forms/formHub.html">แบบฟอร์ม</a>
      <a href="/pages/forms/shopUser.html" class="active">ร้านของฉัน</a>
    </nav>

    <main class="su" id="shopApp">
      <!-- ===================== รายชื่อร้าน ===================== -->
      <section class="su-list-pane" aria-label="รายชื่อร้าน">
        <div class="su-list-head">
          <div class="su-title">
            <h1>ร้านของฉัน</h1>
            <span class="su-count" id="shopCount">0 ร้าน</span>
          </div>
          <div class="su-search">
            <span class="material-symbols-outlined">search</span>
            <input id="searchInput" type="search" placeholder="ค้นหาชื่อร้าน รหัส หรือจังหวัด" autocomplete="off" />
          </div>
          <div class="su-tools">
            <div class="su-seg" role="tablist" aria-label="เรียงลำดับ" id="sortSeg">
              <button type="button" class="active" data-sort="name">ชื่อร้าน</button>
              <button type="button" data-sort="visit">ไม่ได้เยี่ยมนานสุด</button>
            </div>
            <select id="provinceFilter" aria-label="กรองจังหวัด">
              <option value="">ทุกจังหวัด</option>
            </select>
          </div>
        </div>
        <div class="su-list" id="shopList" role="listbox" aria-label="รายชื่อร้าน">
          <div class="su-empty">กำลังโหลด...</div>
        </div>
        <div class="su-legend">
          <span><i class="lv-ok"></i>เยี่ยมใน 7 วัน</span>
          <span><i class="lv-warn"></i>8–30 วัน</span>
          <span><i class="lv-bad"></i>เกิน 30 วัน / ยังไม่เคย</span>
        </div>
      </section>

      <!-- ===================== รายละเอียดร้าน ===================== -->
      <section class="su-detail-pane" id="detailPane" aria-label="รายละเอียดร้าน" aria-live="polite">
        <div class="su-placeholder" id="detailPlaceholder">
          <span class="material-symbols-outlined">storefront</span>
          <p>เลือกร้านจากรายการด้านซ้ายเพื่อดูข้อมูล</p>
        </div>
        <div class="su-detail" id="detailBody" hidden></div>
      </section>
    </main>

    

    <script src="/js/core/supabaseClient.js"></script>
    <script src="/js/core/userService.js"></script>
    <script src="/js/core/roleConfig.js"></script>
  <script src="/js/core/auth.js"></script>
    <script src="/js/services/shopDetailService.js"></script>
    <script src="/js/pages/forms/shopUser.js"></script>

    <script src="/js/core/splash.js"></script> 
  <script src="/js/core/loadingSplash.js"></script>
      <script src="/js/pages/auth/role-theme.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function () { if (typeof RoleTheme !== "undefined") RoleTheme.init(); });</script>
  </body>
</html>
