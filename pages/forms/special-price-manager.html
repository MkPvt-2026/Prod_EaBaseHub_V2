<!doctype html>
<html lang="th">
  <head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding{background:#f1f5f9!important}html.ea-guarding[data-dark]{background:#0f1923!important}html.ea-guarding body{visibility:hidden!important;opacity:0!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EABaseHub | อนุมัติราคาพิเศษ (Manager)</title>
    <link rel="icon" href="/assets/icons/icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base/layout.css" />
    <link rel="stylesheet" href="/css/pages/forms/formPlan-ux.css" />
    <link rel="stylesheet" href="/css/pages/forms/special-price-sale-ux.css" />
    <link rel="stylesheet" href="/css/base/ui-cards.css" />
  </head>
  <body>
    <header class="app-header ui-role-bar">
      <div class="logo">
        <div class="logo-circle"><img src="/assets/icons/icon-192.png" alt="logo" /></div>
        <h2>EABaseHub</h2>
      </div>
      <div class="user-box">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info"><div class="user-name" id="userName">กำลังโหลด...</div></div>
        <button id="logoutBtn" class="logout-btn" onclick="logout()">ออกจากระบบ</button>
      </div>
    </header>

    <main class="fp sp spm spm-list">
      <section class="fp-head ui-role-hero sp-head">
        <div>
          <a class="fp-back" href="/pages/marketing/marketingHome.html"><span class="material-symbols-outlined">arrow_back</span>งานการตลาด</a>
          <h1>อนุมัติราคาพิเศษ <span class="fp-no">Manager · ขั้นที่ 1</span></h1>
          <p>พิจารณาคำขอจากทีมขาย · กดคำขอเพื่อเปิดเอกสาร ลงความเห็นและลงนาม · อนุมัติแล้วระบบส่งต่อผู้บริหารอัตโนมัติ</p>
        </div>
        <ol class="sp-steps" aria-label="ขั้นตอน">
          <li><b>1</b>ผู้ขอส่ง</li>
          <li class="is-now"><b>2</b>Manager อนุมัติ</li>
          <li><b>3</b>ผู้บริหารอนุมัติ</li>
        </ol>
      </section>

      <div class="fp-layout">
        <!-- ===================== คิวคำขอ ===================== -->
        <aside class="fp-side">
          <section class="fp-card fp-panel spm-queue">
            <h2 class="fp-panel-title">
              <span class="material-symbols-outlined">inbox</span> คำขอราคาพิเศษ
              <button type="button" class="fp-icon-only" onclick="loadQueue()" title="รีเฟรช"><span class="material-symbols-outlined">refresh</span></button>
            </h2>
            <p class="spm-scope" id="scopeText"></p>
            <div class="spm-tabs" id="queueTabs" role="tablist">
              <button type="button" class="is-on" data-f="waiting">รออนุมัติ <em id="cntWaiting">0</em></button>
              <button type="button" data-f="forwarded">ส่งผู้บริหารแล้ว <em id="cntForwarded">0</em></button>
              <button type="button" data-f="closed">ปิดแล้ว <em id="cntClosed">0</em></button>
            </div>
            <div class="fp-field" style="margin-bottom:10px">
              <input type="search" id="queueSearch" placeholder="ค้นหาลูกค้า / ผู้ขอ / สินค้า" aria-label="ค้นหา" />
            </div>
            <div id="queueList" class="fp-list"></div>
          </section>
        </aside>

      </div>
    </main>

    <script src="/js/core/supabaseClient.js"></script>
    <script src="/js/core/userService.js"></script>
    <script src="/js/core/roleConfig.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/pages/forms/special-price-common.js"></script>
    <script src="/js/pages/forms/special-price-manager.js"></script>
    <script src="/js/core/splash.js"></script>
    <script src="/js/core/loadingSplash.js"></script>
    <script src="/js/pages/auth/role-theme.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function () { if (typeof RoleTheme !== "undefined") RoleTheme.init(); });</script>
  </body>
</html>
