<!doctype html>
<html lang="th">
  <head>
    <!-- ================= META / PAGE SETUP ================= -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounting Review - ตรวจสอบคำขอวงเงินเกิน</title>

    <!-- ================= FONTS / ICONS ================= -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- ================= PAGE CSS ================= -->
    <link
      rel="stylesheet"
      href="/css/pages/Accounting/credit-limit-finance.css"
    />
  </head>

  <body>
    <div class="app">
      <!-- ================= MOBILE SIDEBAR BACKDROP ================= -->
      <button
        class="sidebar-backdrop"
        type="button"
        onclick="closeSidebar()"
        aria-label="ปิด sidebar"
      ></button>

      <!-- ================= SIDEBAR ================= -->
      <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-circle">
            <img src="/assets/icons/icon-192.png" alt="EABaseHub" />
          </div>
          <div class="sidebar-brand-text">
            <div class="sidebar-brand-title">EABaseHub</div>
            <div class="sidebar-brand-sub">Accounting</div>
          </div>
        </div>

        <nav class="nav-section">
          <a class="nav-item" href="/index.html">
            <span class="material-symbols-outlined" aria-hidden="true"
              >home</span
            >
            หน้าหลัก
          </a>
          <a class="nav-item active" href="credit-limit-finance.html">
            <span class="material-symbols-outlined" aria-hidden="true"
              >fact_check</span
            >
            ตรวจวงเงินเกิน
          </a>
          <a class="nav-item" href="credit-limit-tracking.html">
            <span class="material-symbols-outlined" aria-hidden="true"
              >query_stats</span
            >
            ติดตามคำขอ
          </a>
        </nav>

        <div class="sidebar-user">
          <div class="user-avatar" id="sidebarAvatar">A</div>
          <div class="user-info">
            <div class="user-name" id="sidebarDisplayName">Accounting</div>
            <div class="user-role" id="sidebarRole">accounting</div>
          </div>
          <button
            class="sidebar-logout"
            type="button"
            id="logoutBtn"
            title="ออกจากระบบ"
          >
            <span class="material-symbols-outlined" aria-hidden="true"
              >logout</span
            >
          </button>
        </div>
      </aside>

      <!-- ================= MAIN AREA ================= -->
      <main class="main-area">
        <header class="topbar">
          <button
            class="topbar-menu-btn"
            type="button"
            onclick="openSidebar()"
            aria-label="เปิดเมนู"
          >
            <span class="material-symbols-outlined" aria-hidden="true"
              >menu</span
            >
          </button>
          <div>
            <h1>ตรวจสอบคำขอวงเงินเกิน</h1>
            <p>Accounting Review Console</p>
          </div>
          <div class="topbar-user">
            <div class="user-avatar" id="topbarAvatar">A</div>
            <span id="topbarUsername">Accounting</span>
          </div>
        </header>

        <section class="content">
          <!-- ================= SUMMARY CARDS ================= -->
          <section class="summary-grid">
            <article
              class="summary-card active"
              data-filter="accounting_review"
              onclick="setFilter('accounting_review')"
              role="button"
              tabindex="0"
            >
              <span>รอตรวจสอบ</span>
              <strong id="countPending">0</strong>
            </article>
            <article
              class="summary-card"
              data-filter="manager_review"
              onclick="setFilter('manager_review')"
              role="button"
              tabindex="0"
            >
              <span>ส่งต่อผู้จัดการแล้ว</span>
              <strong id="countForwarded">0</strong>
            </article>
            <article
              class="summary-card"
              data-filter="all"
              onclick="setFilter('all')"
              role="button"
              tabindex="0"
            >
              <span>ทั้งหมด</span>
              <strong id="countAll">0</strong>
            </article>
          </section>

          <!-- ================= SEARCH / REFRESH ================= -->
          <section class="toolbar-card">
            <div class="search-box">
              <span class="material-symbols-outlined" aria-hidden="true"
                >search</span
              >
              <input
                id="searchInput"
                type="search"
                placeholder="ค้นหาเลขที่เอกสาร / บริษัท / เลขที่บิล"
                oninput="renderRequests()"
                autocomplete="off"
              />
            </div>
            <button
              class="btn btn-outline"
              type="button"
              onclick="loadAccountingRequests()"
            >
              <span class="material-symbols-outlined" aria-hidden="true"
                >refresh</span
              >
              รีเฟรช
            </button>
          </section>

          <!-- ================= REQUEST LIST ================= -->
          <section id="requestList" aria-live="polite" aria-atomic="false">
            <div class="empty-state">กำลังโหลดข้อมูล...</div>
          </section>
        </section>
      </main>
    </div>

    <!-- ================= TOAST MESSAGE ================= -->
    <div
      id="toast"
      class="toast"
      role="alert"
      aria-live="assertive"
      aria-atomic="true"
    ></div>


    <!-- Success Modal -->
<div id="successModal" class="success-modal hidden">
  <div class="success-modal-box">

    <div class="success-icon">
      <span class="material-symbols-outlined">
        check_circle
      </span>
    </div>

    <h3 id="successTitle">
      สำเร็จ
    </h3>

    <p id="successMessage">
      ระบบดำเนินการเรียบร้อยแล้ว
    </p>

    <button
      type="button"
      class="btn btn-primary"
      onclick="closeSuccessModal()"
    >
      ตกลง
    </button>

  </div>
</div>

    <!-- ================================================================
       TEMPLATES — ไม่ render บนหน้าจอ, JS clone ไปใช้งาน
       แก้ UI ที่นี่ได้เลย ได้ syntax highlight / Emmet ครบ
  ================================================================ -->

    <!-- ── Template: request-card ──────────────────────────────────── -->
    <template id="tpl-request-card">
      <article class="request-card" data-request-id="">
        <!-- Accordion header -->
        <button
          class="request-head"
          type="button"
          onclick="toggleRequestCard(this)"
          aria-expanded="false"
        >
          <div class="request-head-left">
            <span class="expand-icon" aria-hidden="true">⌄</span>
            <div class="request-title">

  <!-- ชื่อร้าน + เลขที่บิล -->
  <h3>
    <span data-bind="shopName"></span>
    <span class="bill-separator">•</span>
    <span data-bind="saleOrderNo"></span>
  </h3>

  <!-- เลขที่เอกสาร -->
  <p class="doc-no">
    เลขที่เอกสาร :
    <span data-bind="docNo"></span>
  </p>

</div>
        </button>

        <!-- Accordion body -->
        <div class="request-content">
          <div class="request-body">
            <div class="review-layout">
              <!-- ── Left column ─────────────────────────────── -->
              <div class="left-stack">
                <!-- =======================================================
                     SECTION : ข้อมูลคำขอ
                     class: panel-request
                     ใช้สำหรับแยกสี / style เฉพาะส่วนข้อมูลคำขอ
                ======================================================= -->
                <section class="panel panel-request">
                  <div class="panel-head">
                    <div class="panel-title">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >receipt_long</span
                      >
                      ข้อมูลคำขอ
                    </div>
                  </div>
                  <div class="panel-body">
                    <div class="customer-grid">
                      <div class="customer-item">
                        <label>บริษัท</label>
                        <strong data-bind="shopName2"></strong>
                      </div>
                      <div class="customer-item">
                        <label>รหัสลูกค้า</label>
                        <strong data-bind="shopCode"></strong>
                      </div>
                      <div class="customer-item">
                        <label>เลขที่บิล</label>
                        <strong data-bind="saleOrderNo2"></strong>
                      </div>
                      <div class="customer-item">
                        <label>ยอดคำขอ</label>
                        <strong
                          class="text-red"
                          data-bind="requestAmount"
                        ></strong>
                      </div>
                      <div class="customer-item">
                        <label>วงเงินเครดิต</label>
                        <strong data-bind="currentCreditLimit"></strong>
                      </div>
                      <div class="customer-item">
                        <label>Sale</label>
                        <strong data-bind="saleName"></strong>
                      </div>
                      <div class="customer-item">
                        <label>วันที่ส่งคำขอ</label>
                        <strong data-bind="createdAt"></strong>
                      </div>
                    </div>
                  </div>
                </section>

                <!-- =======================================================
                     SECTION : ข้อมูลฝ่ายบัญชี
                     class: panel-accounting
                     ใช้สำหรับแยกสี / style เฉพาะส่วนกรอกข้อมูลบัญชี
                ======================================================= -->
                <section class="panel panel-accounting">
                  <div class="panel-head">
                    <div class="panel-title">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >edit_note</span
                      >
                      ข้อมูลฝ่ายบัญชี
                    </div>
                  </div>
                  <div class="panel-body">
                    <div class="accounting-grid">
                      <div class="field">
                        <label data-label-for="risk">ระดับความเสี่ยง</label>
                        <select data-field="risk">
                          <option value="">-- เลือกความเสี่ยง --</option>
                          <option value="low">ต่ำ</option>
                          <option value="medium">ปานกลาง</option>
                          <option value="high">สูง</option>
                        </select>
                      </div>

                      <div class="field">
                        <label data-label-for="verifiedCredit"
                          >วงเงินจริงที่บัญชีตรวจสอบแล้ว (บาท)</label
                        >
                        <input
                          data-field="verifiedCredit"
                          type="text"
                          inputmode="numeric"
                          placeholder="เช่น 50,000"
                        />
                      </div>

                      <div class="field full">
                        <label data-label-for="recommend"
                          >ข้อเสนอแนะจากฝ่ายบัญชี</label
                        >
                        <textarea
                          data-field="recommend"
                          maxlength="1000"
                          placeholder="เช่น แนะนำอนุมัติวงเงินชั่วคราวไม่เกิน ..."
                        ></textarea>
                        <span class="small-note"
                          >ข้อความนี้ใช้สำหรับ Manager / Executive —
                          ไม่แสดงในหน้า Sale</span
                        >
                      </div>

                      <!-- <div class="field full">
                        <label data-label-for="summary">สรุปผลจากบัญชี</label>
                        <textarea
                          data-field="summary"
                          maxlength="1000"
                          placeholder="สรุปเฉพาะข้อมูลที่ต้องการให้ Manager / Executive เห็น"
                        ></textarea>
                      </div> -->
                    </div>
                  </div>
                </section>

                <!-- =======================================================
                     SECTION : ผลวิเคราะห์จาก PDF
                     class: panel-analysis
                     ซ่อนอยู่ก่อน และจะแสดงเมื่ออ่าน/วิเคราะห์ PDF สำเร็จ
                ======================================================= -->
                <section class="panel panel-analysis js-analysis-panel" style="display: none">
                  <div class="panel-head">
                    <div class="panel-title">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >insights</span
                      >
                      ผลวิเคราะห์จาก PDF
                    </div>
                    <span class="analysis-badge js-analysis-badge"></span>
                  </div>
                  <div class="panel-body js-analysis-body"></div>
                </section>
              </div>
              <!-- /left-stack -->

              <!-- ── Right sticky column ──────────────────── -->
              <aside class="right-sticky">
                <!-- =======================================================
                     SECTION : ลำดับการดำเนินการ
                     class: panel-flow
                     ใช้สำหรับแสดงขั้นตอน Sale → บัญชี → Manager → ผู้บริหาร
                ======================================================= -->
                <section class="panel panel-flow">
                  <div class="panel-head">
                    <div class="panel-title">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >timeline</span
                      >
                      ลำดับการดำเนินการ
                    </div>
                  </div>
                  <div class="panel-body">
                    <div class="flow-vertical">

  <div class="flow-step done">
    <div class="flow-dot">
      <span class="material-symbols-outlined">check</span>
    </div>

    <div class="flow-content">
      <strong>Sale ส่งคำขอ</strong>
      <span>ส่งคำขอเรียบร้อยแล้ว</span>
    </div>
  </div>

  <div class="flow-step active">
    <div class="flow-dot"></div>

    <div class="flow-content">
      <strong>บัญชีตรวจสอบ</strong>
      <span>กำลังดำเนินการ</span>
    </div>
  </div>

  <div class="flow-step">
    <div class="flow-dot"></div>

    <div class="flow-content">
      <strong>ผู้จัดการอนุมัติ</strong>
      <span>รอดำเนินการ</span>
    </div>
  </div>

  <div class="flow-step">
    <div class="flow-dot"></div>

    <div class="flow-content">
      <strong>ผู้บริหารอนุมัติ</strong>
      <span>รอดำเนินการ</span>
    </div>
  </div>

</div>
                  </div>
                </section>
                <!-- /approval flow -->

                <!-- =======================================================
                     SECTION : เอกสารข้อมูลการเงินภายใน / PDF Upload
                     class: panel-pdf
                     ใช้สำหรับอัปโหลด เปิด ลบ และอ่านข้อมูลจาก PDF
                ======================================================= -->
                <section class="panel panel-pdf">
                  <div class="panel-head">
                    <div class="panel-title">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >picture_as_pdf</span
                      >
                      เอกสารข้อมูลการเงินภายใน
                    </div>
                  </div>

                  <div class="panel-body">
                    <div class="upload-drop-card">
                      <input
                        data-field="pdfInput"
                        type="file"
                        accept="application/pdf,.pdf"
                        hidden
                      />

                      <button
                        class="upload-drop-zone"
                        type="button"
                        onclick="
                          this.closest('[data-request-id]')
                            .querySelector('[data-field=pdfInput]')
                            .click()
                        "
                      >
                        <span class="material-symbols-outlined upload-icon"
                          >cloud_upload</span
                        >
                        <strong>ลากไฟล์ PDF มาวางที่นี่</strong>
                        <span>หรือคลิกเพื่อเลือกไฟล์</span>
                      </button>

                      <div class="upload-helper-row">
                        <span>รองรับไฟล์: PDF</span>
                        <span>ขนาดสูงสุด: 15MB</span>
                      </div>

                      <div class="uploaded-file-card">
                        <div class="file-icon-pdf">
                          <span class="material-symbols-outlined"
                            >picture_as_pdf</span
                          >
                        </div>

                        <div class="uploaded-file-info">
                          <strong data-bind="pdfName"
                            >ยอดคงค้าง คอนเซอร์เทก.pdf</strong
                          >
                          <span>Private Storage</span>

                          <a
                            class="file-link js-pdf-link"
                            href="#"
                            style="display: none"
                          >
                            เปิดไฟล์ PDF
                          </a>
                        </div>

                        <button
                          type="button"
                          class="pdf-delete-btn js-delete-pdf-btn"
                          style="display: none"
                          title="ลบไฟล์ PDF"
                        >
                          <span class="material-symbols-outlined">delete</span>
                        </button>
                      </div>

                      <button
                        class="btn btn-analyze upload-full-btn js-analyze-btn"
                        type="button"
                        style="display: none"
                      >
                        <span class="material-symbols-outlined"
                          >auto_awesome</span
                        >
                        อ่านข้อมูลจาก PDF
                      </button>
                      <span class="small-note js-no-pdf-note"
                        >อัปโหลด PDF ก่อนเพื่ออ่านข้อมูล</span
                      >
                    </div>
                  </div>
                </section>
                <!-- /pdf upload -->

                <!-- =======================================================
                     SECTION : ลายเซ็นผู้ตรวจสอบฝ่ายบัญชี
                     class: panel-signature
                     ใช้สำหรับแยกสี / style เฉพาะส่วนลายเซ็น
                ======================================================= -->
                <section class="panel panel-signature signature-panel">
                  <div class="panel-head">
                    <div class="panel-title">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >draw</span
                      >
                      ลายเซ็นผู้ตรวจสอบ (ฝ่ายบัญชี)
                    </div>
                  </div>

                  <div class="panel-body">
                    <div class="signature-preview-card">
                      <div class="signature-empty js-signature-empty">
                        <span
                          class="material-symbols-outlined"
                          aria-hidden="true"
                          >gesture</span
                        >
                        <strong>ยังไม่ได้บันทึกลายเซ็น</strong>
                        <span>กดปุ่มด้านล่างเพื่อเซ็นชื่อผู้ตรวจสอบ</span>
                      </div>

                      <div
                        class="signature-image-wrap js-signature-image-wrap hidden"
                      >
                        <img
                          class="signature-image js-signature-image"
                          alt="ลายเซ็นผู้ตรวจสอบฝ่ายบัญชี"
                        />
                      </div>
                    </div>

                    <div class="signature-actions">
                      <button
                        class="btn btn-outline js-open-signature"
                        type="button"
                      >
                        <span
                          class="material-symbols-outlined"
                          aria-hidden="true"
                          >edit</span
                        >
                        เซ็นลายเซ็น
                      </button>
                      <button
                        class="btn btn-danger js-clear-signature-display"
                        type="button"
                      >
                        <span
                          class="material-symbols-outlined"
                          aria-hidden="true"
                          >delete</span
                        >
                        ลบลายเซ็น
                      </button>
                    </div>
                  </div>

                  <!-- Signature modal: อยู่ในแต่ละ card เพื่อไม่ให้ id ซ้ำ -->
                  <div class="modal-overlay signature-modal js-signature-modal">
                    <div class="modal-box signature-modal-box">
                      <div class="modal-head">
                        <h3>เซ็นชื่อผู้ตรวจสอบบัญชี</h3>
                        <button
                          class="modal-close js-close-signature"
                          type="button"
                          aria-label="ปิดหน้าต่างลายเซ็น"
                        >
                          ✕
                        </button>
                      </div>

                      <div class="modal-body">
                        <p class="modal-sub">กรุณาเซ็นลายเซ็นในช่องด้านล่าง</p>

                        <div class="sig-container">
                          <canvas
                            class="sig-canvas js-signature-canvas"
                            height="180"
                            width="520"
                          ></canvas>
                          <div class="sig-hint js-signature-hint">
                            วาดลายเซ็นที่นี่
                          </div>
                        </div>
                      </div>

                      <div class="modal-foot">
                        <button
                          class="btn btn-outline js-clear-signature"
                          type="button"
                        >
                          <span
                            class="material-symbols-outlined"
                            aria-hidden="true"
                            >mop</span
                          >
                          ล้างลายเซ็น
                        </button>
                        <button
                          class="btn btn-primary js-save-signature"
                          type="button"
                        >
                          <span
                            class="material-symbols-outlined"
                            aria-hidden="true"
                            >check</span
                          >
                          บันทึกลายเซ็น
                        </button>
                      </div>
                    </div>
                  </div>
                </section>
                <!-- /accounting signature -->

                <!-- Action buttons -->
                <section class="action-box">
                  <h4>การดำเนินการ</h4>
                  <div class="action-row">
                    <button class="btn btn-outline js-btn-save" type="button">
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >save</span
                      >
                      บันทึกข้อมูลบัญชี
                    </button>
                    <button
                      class="btn btn-primary js-btn-forward"
                      type="button"
                    >
                      <span class="material-symbols-outlined" aria-hidden="true"
                        >send</span
                      >
                      ส่งต่อผู้จัดการ
                    </button>
                  </div>
                </section>
                <!-- /action-box -->
              </aside>
              <!-- /right-sticky -->
            </div>
            <!-- /review-layout -->
          </div>
          <!-- /request-body -->
        </div>
        <!-- /request-content -->
      </article>
    </template>

    <!-- ── Template: aging analysis body ──────────────────────────── -->
    <!--
    JS จะ clone template นี้ แล้ว fill ข้อมูล aging แต่ละรายการ
    ใช้แทน renderAnalysisBody() ที่เคย return HTML string
  -->
    <template id="tpl-analysis-body">
      <div class="aging-grid">
        <!-- JS loop ใส่ .aging-row ทีละแถว โดย clone tpl-aging-row -->
      </div>

      <div class="aging-meta">
        <div class="aging-meta-item">
          <label>ลูกค้า</label>
          <strong data-bind="customerName"></strong>
        </div>
        <div class="aging-meta-item">
          <label>วันที่รายงาน</label>
          <strong data-bind="reportDate"></strong>
        </div>
        <div class="aging-meta-item">
          <label>ค้างเกิน 30 วัน (%)</label>
          <strong data-bind="overduePct" class="js-overdue-pct"></strong>
        </div>
        <div class="aging-meta-item">
          <label>ค้างนานสุด</label>
          <strong data-bind="oldestOverdue" class="js-oldest-overdue"></strong>
        </div>
        <div class="aging-meta-item">
          <label>วงเงินเครดิต</label>
          <strong data-bind="verifiedCreditLimit"></strong>
        </div>
        <div class="aging-meta-item">
          <label>วงเงินคงเหลือ</label>
          <strong
            data-bind="creditRemaining"
            class="js-credit-remaining"
          ></strong>
        </div>
        <div class="aging-meta-item">
          <label>ระดับความเสี่ยง</label>
          <strong class="risk-badge" data-bind="riskLabel"></strong>
        </div>
        <div class="aging-meta-item">
          <label>สถานะวงเงิน</label>
          <strong data-bind="creditStatus" class="js-credit-status"></strong>
        </div>
      </div>

      <div class="aging-reason js-aging-reason" style="display: none">
        <span
          class="material-symbols-outlined"
          style="font-size: 15px; vertical-align: -3px"
          aria-hidden="true"
          >info</span
        >
        <span data-bind="riskReason"></span>
      </div>

      <div class="aging-summary js-aging-summary" style="display: none">
        <span data-bind="summaryTh"></span>
      </div>

      <div class="aging-edit-hint">
        <span
          class="material-symbols-outlined"
          style="font-size: 14px; vertical-align: -2px"
          aria-hidden="true"
          >edit</span
        >
        ตัวเลขด้านล่างถูกกรอกอัตโนมัติแล้ว — ตรวจสอบและแก้ไขได้ก่อนบันทึก
      </div>
    </template>

    <!-- ── Template: aging row (1 แถวใน .aging-grid) ──────────────── -->
    <template id="tpl-aging-row">
      <div class="aging-row">
        <span data-bind="label"></span>
        <span data-bind="value"></span>
      </div>
    </template>


    <!-- ── Template: forward confirmation modal ── -->
<template id="tpl-forward-confirm">
  <div class="modal-overlay forward-confirm-modal js-forward-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>
          <span class="material-symbols-outlined" style="vertical-align:-4px;font-size:20px;color:#D97706">warning</span>
          ยืนยันส่งต่อผู้จัดการ
        </h3>
        <button class="modal-close js-forward-close" type="button" aria-label="ปิด">✕</button>
      </div>
      <div class="modal-body">
        <p style="color:#64748B;font-size:13px;margin-bottom:14px">
          กรุณาตรวจสอบข้อมูลด้านล่างก่อนส่งต่อ — แก้ไขได้ในหน้านี้หากพบข้อผิดพลาด
        </p>
        <div class="confirm-summary-grid">
          <div class="confirm-row"><span>ยอดคงค้างรวม</span><strong data-bind="cs-total" class="text-red"></strong></div>
          <div class="confirm-row"><span>ค้างเกิน 30 วัน</span><strong data-bind="cs-overdue30"></strong></div>
          <div class="confirm-row"><span>ค้างเกิน 30 วัน (%)</span><strong data-bind="cs-overduePct" class="js-cs-pct"></strong></div>
          <div class="confirm-row"><span>ค้างนานสุด</span><strong data-bind="cs-oldest" class="js-cs-oldest"></strong></div>
          <div class="confirm-row"><span>วงเงินที่ตรวจสอบแล้ว</span><strong data-bind="cs-credit"></strong></div>
          <div class="confirm-row"><span>วงเงินคงเหลือ</span><strong data-bind="cs-remaining" class="js-cs-remaining"></strong></div>
          <div class="confirm-row"><span>ระดับความเสี่ยง</span><strong data-bind="cs-risk" class="js-cs-risk"></strong></div>
          <div class="confirm-row"><span>สถานะวงเงิน</span><strong data-bind="cs-status" class="js-cs-status"></strong></div>
        </div>
        <div class="confirm-remark-box">
          <label>ข้อเสนอแนะที่จะส่งให้ผู้จัดการ</label>
          <p data-bind="cs-recommend" class="confirm-remark-text"></p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline js-forward-cancel" type="button">แก้ไขข้อมูล</button>
        <button class="btn btn-primary js-forward-confirm" type="button">
          <span class="material-symbols-outlined" style="font-size:17px">send</span>
          ยืนยันส่งต่อผู้จัดการ
        </button>
      </div>
    </div>
  </div>
</template>
