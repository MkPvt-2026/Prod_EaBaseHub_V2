<!DOCTYPE html>
<html lang="th">
<head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding body{visibility:hidden!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | แก้ไขผู้ใช้</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">


<link rel="stylesheet" href="/css/base/adminBase.css">

    <link rel="stylesheet" href="/css/base/ui-cards.css" />
  </head>

<body class="ui-dark">

<header class="topbar">
  <div class="brand">Admin Panel</div>
  <a href="admintor.html" class="btn">← กลับ</a>
</header>

<main class="container small">

  <h2>แก้ไขผู้ใช้</h2>

  <!-- Input ต่าง ๆ จะถูกเติมค่าโดย JS -->
  <label>Email</label>
  <input id="email" disabled>

  <label>Username</label>
  <input id="username" disabled>

  <label>ชื่อที่แสดง</label>
  <input id="displayName">

  <label>พื้นที่</label>
<input id="area" placeholder="เช่น กรุงเทพ, ภาคเหนือ, ภาคกลาง">


  <label>Role</label>
  <select id="role">
    <option value="user">User</option>
    <option value="sales">Sales</option>
    <option value="manager">Manager</option>
    <option value="executive">Executive</option>
    <option value="adminQc">AdminQC</option>
    <option value="accounting">Accounting</option>
    <option value="marketing">Marketing</option>
    <option value="admin">Admin</option>
  </select>

  <label>Status</label>
  <select id="status">
    <option value="Active">Active</option>
    <option value="Inactive">Inactive</option>
  </select>

  <button onclick="saveUser()">บันทึก</button>

</main>

<script src="/js/core/supabaseClient.js"></script>
<script src="/js/core/roleConfig.js"></script>
  <script src="/js/core/auth.js"></script>
<script src="/js/pages/admin/adminEdit.js"></script>


    <script src="/js/pages/auth/role-theme.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function () { if (typeof RoleTheme !== "undefined") RoleTheme.init(); });</script>
  </body>
</html>
