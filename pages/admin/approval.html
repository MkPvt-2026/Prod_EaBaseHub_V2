<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding{background:#f1f5f9!important}html.ea-guarding[data-dark]{background:#0f1923!important}html.ea-guarding body{visibility:hidden!important;opacity:0!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
  <meta charset="UTF-8">
  <title>EABaseHub | Approval</title>

  <link rel="stylesheet" href="/css/base/adminBase.css">
  <link rel="stylesheet" href="/css/pages/Qc-claim/adminQc.css">

  <style>
    .tabs { display:flex; gap:10px; margin-bottom:16px; }
    .tab { padding:8px 16px; border-radius:20px; cursor:pointer; background:#1e293b; }
    .tab.active { background:#2563eb; color:#fff; }

    .exec-actions { display:flex; gap:10px; margin-top:10px; }
    .btn-approve { background:#16a34a; color:#fff; }
    .btn-reject { background:#dc2626; color:#fff; }
  </style>
    <link rel="stylesheet" href="/css/base/ui-cards.css" />
  </head>

<body>

<header class="app-header">
  <h2>Approval (ผู้บริหาร)</h2>
</header>

<nav class="app-nav">
  <a href="/pages/dashboard/QcDashboard.html">Dashboard</a>
  <a href="/pages/Qc-claim/adminQc.html">QC</a>
  <a href="/pages/admin/approval.html" class="active">Approval</a>
</nav>

<main class="container">

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" data-tab="pending">🟡 รออนุมัติ</div>
    <div class="tab" data-tab="approved">✅ อนุมัติแล้ว</div>
    <div class="tab" data-tab="rejected">❌ ไม่อนุมัติ</div>
  </div>

  <!-- TABLE -->
  <table class="qc-table">
    <thead>
      <tr>
        <th>วันที่</th>
        <th>สินค้า</th>
        <th>ร้านค้า</th>
        <th>QC</th>
        <th>สถานะ</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</main>

<!-- MODAL -->
<div class="qc-modal" id="modal">
  <div class="qc-modal-box">

    <div class="qc-modal-header">
      <h3 id="modalTitle">รายละเอียด</h3>
      <button onclick="closeModal()">❌</button>
    </div>

    <div class="qc-modal-body" id="modalBody"></div>

    <div class="exec-actions">
      <button class="btn-approve" onclick="updateExec('approved')">อนุมัติ</button>
      <button class="btn-reject" onclick="updateExec('rejected')">ไม่อนุมัติ</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/core/supabaseClient.js"></script>
<script src="/js/core/roleConfig.js"></script>
  <script src="/js/core/auth.js"></script>

<script src="/js/pages/admin/approval.js"></script>

    <script src="/js/pages/auth/role-theme.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function () { if (typeof RoleTheme !== "undefined") RoleTheme.init(); });</script>
  </body>
</html>
