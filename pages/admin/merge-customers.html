<!DOCTYPE html>
<html lang="th">
<head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding{background:#f1f5f9!important}html.ea-guarding[data-dark]{background:#0f1923!important}html.ea-guarding body{visibility:hidden!important;opacity:0!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
  <meta charset="UTF-8">
  <title>Merge Customers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/pages/admin/merge-customers.css">
    <link rel="stylesheet" href="/css/base/ui-cards.css" />
  </head>
<body>

<div class="page">

  <header class="page-header">
    <div>
      <a href="/pages/dashboard/adminDashboard.html" class="back-link">← กลับ</a>
      <h1>Merge Customers</h1>
      <p>รวมลูกค้าที่มีหลายรหัสให้เป็นลูกค้าเดียวกัน</p>
    </div>
  </header>

  <section class="toolbar">

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อลูกค้า">
      <button onclick="MergeCustomer.loadCandidates()">ค้นหา</button>
    </div>

  </section>

  <section class="content-grid">

    <div class="left-panel">

      <div class="card">
        <div class="card-header">
          ลูกค้าที่อาจซ้ำกัน
        </div>

        <div id="candidateList" class="candidate-list"></div>
      </div>

    </div>

    <div class="right-panel">

      <div class="card sticky-card">

        <div class="card-header">
          Merge Selected Customers
        </div>

        <div class="form-group">
          <label>Master Customer Code</label>
          <input type="text" id="masterCustomer" placeholder="เช่น CUST001">
        </div>

        <div class="form-group">
          <label>Master Customer Name</label>
          <input type="text" id="masterName" placeholder="ชื่อหลัก">
        </div>

        <button class="btn-primary" onclick="MergeCustomer.mergeSelected()">
          Merge Customers
        </button>

      </div>

    </div>

  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/core/supabaseClient.js"></script>
<script src="/js/core/roleConfig.js"></script>
<script src="/js/core/auth.js"></script>
<script src="/js/pages/admin/merge-customers.js"></script>

    <script src="/js/pages/auth/role-theme.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function () { if (typeof RoleTheme !== "undefined") RoleTheme.init(); });</script>
  </body>
</html>
