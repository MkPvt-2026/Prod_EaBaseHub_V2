<!doctype html>
<html lang="th" data-dark>
  <head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding{background:#f1f5f9!important}html.ea-guarding[data-dark]{background:#0f1923!important}html.ea-guarding body{visibility:hidden!important;opacity:0!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EABaseHub | คำขอเปิดร้านค้าใหม่ (Admin)</title>
    <link rel="icon" href="/assets/icons/icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base/adminBase.css" />
    <link rel="stylesheet" href="/css/pages/admin/admintor-ux.css" />
    <link rel="stylesheet" href="/css/pages/admin/Adminannouncements-admin.css" />
    <link rel="stylesheet" href="/css/base/ui-cards.css" />
    <link rel="stylesheet" href="/css/pages/admin/newShopRequests.css" />
  </head>
  <!-- คำขอเปิดร้านค้าใหม่ที่ผู้บริหารอนุมัติแล้ว → Admin สร้างร้านในระบบ (shops + shop_details) -->
  <body class="ui-dark role-admin">
    <header class="app-header ui-role-bar">
      <div class="logo">
        <div class="logo-circle"><img src="/assets/icons/icon-192.png" alt="logo" /></div>
        <h2>EABaseHub</h2>
      </div>
      <div class="user-box">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info"><div class="user-name" id="userName">กำลังโหลด...</div></div>
        <button id="logoutBtn" class="logout-btn" type="button">ออกจากระบบ</button>
      </div>
    </header>

    <!-- เมนู Admin (โหลดจาก /pages/components/nav-admin.html) -->
    <div id="navContainer"></div>

    <main class="at nsr">
      <section class="at-head">
        <div class="at-head-title">
          <a class="at-back" href="/pages/dashboard/adminDashboard.html"><span class="material-symbols-outlined">arrow_back</span>Admin Dashboard</a>
          <h1><span class="material-symbols-outlined">add_business</span> คำขอเปิดร้านค้าใหม่</h1>
          <p>ผู้บริหารอนุมัติแล้ว → ตรวจข้อมูล ใส่รหัสลูกค้า แล้วกด “สร้างร้าน” · ร้านจะเข้า “ร้านของฉัน” ของเซลล์ทันที และเซลล์ได้รับแจ้งเตือน</p>
        </div>
      </section>

      <section class="at-card">
        <div class="at-toolbar">
          <div class="an-filters" role="tablist" aria-label="สถานะ">
            <button type="button" class="at-chip is-on" data-f="todo">รอสร้างร้าน <b id="cTodo">0</b></button>
            <button type="button" class="at-chip" data-f="done">สร้างแล้ว <b id="cDone">0</b></button>
            <button type="button" class="at-chip" data-f="pending">กำลังพิจารณา <b id="cPending">0</b></button>
            <button type="button" class="at-chip" data-f="closed">ไม่อนุมัติ / ขอข้อมูลเพิ่ม <b id="cClosed">0</b></button>
          </div>
          <label class="at-search">
            <span class="material-symbols-outlined">search</span>
            <input type="search" id="q" placeholder="ค้นหาร้าน / จังหวัด / เซลล์" autocomplete="off" />
          </label>
          <button type="button" class="at-icon-btn" onclick="NSR.load()" title="รีเฟรช" aria-label="รีเฟรช"><span class="material-symbols-outlined">refresh</span></button>
        </div>
        <div class="at-state" id="stateBox">กำลังโหลด...</div>
        <div class="at-table-wrap" id="tableWrap" hidden>
          <table class="at-table">
            <thead><tr><th>ร้าน</th><th>พื้นที่</th><th>เซลล์</th><th>การค้า</th><th>สถานะ</th><th class="c-act"></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- ดูเอกสาร -->
    <div class="at-modal" id="docModal" hidden>
      <div class="at-modal-box nsr-doc-box" onclick="event.stopPropagation()">
        <div class="at-modal-head"><h3 id="docTitle">เอกสาร</h3>
          <button type="button" class="at-icon-btn" onclick="NSR.close('docModal')" aria-label="ปิด"><span class="material-symbols-outlined">close</span></button></div>
        <div class="at-modal-body nsr-paper-wrap"><div class="nsr-paper" id="docBody"></div></div>
        <div class="at-modal-foot">
          <button type="button" class="at-btn-ghost" onclick="NSR.close('docModal')">ปิด</button>
          <button type="button" class="at-btn-ghost" id="docPrint"><span class="material-symbols-outlined">print</span>พิมพ์ / PDF</button>
        </div>
      </div>
    </div>

    <!-- สร้างร้าน -->
    <div class="at-modal" id="createModal" hidden>
      <div class="at-modal-box announce-form-modal" onclick="event.stopPropagation()">
        <div class="at-modal-head"><h3>สร้างร้านในระบบ</h3>
          <button type="button" class="at-icon-btn" onclick="NSR.close('createModal')" aria-label="ปิด"><span class="material-symbols-outlined">close</span></button></div>
        <div class="at-modal-body">
          <div class="at-note" id="cNote"></div>
          <div class="at-form">
            <label class="at-field an-wide"><span>ชื่อร้าน <i>*</i></span><input type="text" id="fName" maxlength="150" /></label>
            <label class="at-field"><span>รหัสลูกค้า <small>(ตามระบบบัญชี · ถ้ามี)</small></span><input type="text" id="fCode" maxlength="40" placeholder="เช่น C1234" /></label>
            <label class="at-field"><span>จังหวัด</span><input type="text" id="fProvince" maxlength="80" /></label>
            <label class="at-field an-wide"><span>เซลล์ที่ดูแล <i>*</i></span><select id="fSale"></select></label>
            <label class="at-field an-wide"><span>ที่อยู่</span><input type="text" id="fAddress" maxlength="300" /></label>
            <label class="at-field"><span>ผู้ติดต่อ</span><input type="text" id="fContact" maxlength="100" /></label>
            <label class="at-field"><span>เบอร์โทร</span><input type="text" id="fPhone" maxlength="30" /></label>
            <label class="at-field"><span>LINE ID</span><input type="text" id="fLine" maxlength="60" /></label>
            <label class="at-field"><span>ลิงก์แผนที่</span><input type="url" id="fMap" /></label>
            <label class="an-pin an-wide" id="fPhotosWrap"><input type="checkbox" id="fPhotos" checked /><span class="material-symbols-outlined">photo_library</span><span id="fPhotosText">ใช้รูปร้านจากคำขอเป็นรูปร้าน</span></label>
          </div>
          <div class="at-field-err" id="cErr" hidden></div>
        </div>
        <div class="at-modal-foot">
          <button type="button" class="at-btn-ghost" onclick="NSR.close('createModal')">ยกเลิก</button>
          <button type="button" class="at-btn-primary" id="cSave"><span class="material-symbols-outlined">add_business</span>สร้างร้าน</button>
        </div>
      </div>
    </div>

    <div class="at-toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/js/core/supabaseClient.js"></script>
    <script src="/js/core/userService.js"></script>
    <script src="/js/core/roleConfig.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/services/approval-notify.js"></script>
    <script src="/js/pages/forms/special-price-common.js"></script>
    <script src="/js/pages/forms/new-shop-common.js"></script>
    <script src="/js/pages/admin/newShopRequests.js"></script>
    <script src="/js/pages/auth/role-theme.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (typeof RoleTheme !== "undefined") RoleTheme.init();
        try {
          const res = await fetch("/pages/components/nav-admin.html");
          if (res.ok) {
            document.getElementById("navContainer").innerHTML = await res.text();
            document.querySelectorAll("#navContainer .app-nav a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === location.pathname));
          }
        } catch (e) { console.warn("nav:", e); }
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          try { await supabaseClient.auth.signOut(); } catch (e) { /* ignore */ }
          location.href = "/pages/auth/login.html";
        });
        if (!window.currentUser?.id && typeof loadCurrentUser === "function") { try { await loadCurrentUser(); } catch (e) { /* ignore */ } }
        const u = window.currentUser || {};
        const name = u.display_name || u.full_name || u.username || u.email || "Admin";
        document.getElementById("userName").textContent = name;
        document.getElementById("userAvatar").textContent = String(name).trim().charAt(0).toUpperCase();
      });
    </script>
  </body>
</html>
