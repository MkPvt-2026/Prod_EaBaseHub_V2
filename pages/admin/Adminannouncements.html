<!doctype html>
<html lang="th">
  <head>
    <!-- ea-guard: ซ่อนหน้าระหว่างตรวจสิทธิ์ (auth.js · roleConfig.js) -->
    <style>html.ea-guarding body{visibility:hidden!important}</style>
    <script>document.documentElement.classList.add("ea-guarding");setTimeout(function(){if(document.documentElement.classList.contains("ea-guarding")&&!window.__eaGuard){document.documentElement.classList.remove("ea-guarding");document.body.innerHTML='<p style="font-family:sans-serif;text-align:center;margin-top:20vh">ตรวจสอบสิทธิ์ไม่สำเร็จ — <a href="javascript:location.reload()">ลองใหม่</a></p>';}},10000);</script>
    <link rel="stylesheet" href="/css/base/role-colors.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EABaseHub | ประชาสัมพันธ์ (Admin)</title>
    <link rel="icon" href="/assets/icons/icon-192.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/base/adminBase.css" />
    <link rel="stylesheet" href="/css/pages/admin/admintor-ux.css" />
    <link rel="stylesheet" href="/css/pages/admin/Adminannouncements-admin.css" />
    <link rel="stylesheet" href="/css/base/ui-cards.css" />
  </head>
  <!-- หน้าประชาสัมพันธ์ฝั่ง Admin
       ฝั่งการตลาด (Manager / Marketing) ใช้ /pages/marketing/announcements.html
       ทั้งสองหน้าเขียนตาราง announcements เดียวกัน → แสดงที่การ์ด "ประชาสัมพันธ์" หน้าแรกของเซลล์ (index.html) -->
  <body class="ui-dark role-admin">
    <header class="app-header ui-role-bar">
      <div class="logo">
        <div class="logo-circle"><img src="/assets/icons/icon-192.png" alt="logo" /></div>
        <h2>EABaseHub</h2>
      </div>
      <div class="user-box">
        <div class="user-avatar" id="userAvatar">👤</div>
        <div class="user-info"><div class="user-name" id="userName">กำลังโหลด...</div></div>
        <button id="logoutBtn" class="logout-btn" type="button">ออกจากระบบ</button>
      </div>
    </header>

    <!-- เมนู Admin (โหลดจาก /pages/components/nav-admin.html) -->
    <div id="navContainer"></div>

    <main class="at an">
      <section class="at-head">
        <div class="at-head-title">
          <a class="at-back" href="/pages/dashboard/adminDashboard.html"><span class="material-symbols-outlined">arrow_back</span>Admin Dashboard</a>
          <h1><span class="material-symbols-outlined">campaign</span> ประชาสัมพันธ์</h1>
          <p>ประกาศ / ข่าวสารที่เผยแพร่จะแสดงในการ์ด “ประชาสัมพันธ์” หน้าแรกของเซลล์ · ประกาศชุดเดียวกับฝั่งการตลาด</p>
        </div>
        <button type="button" class="at-btn-primary" onclick="AdminAnnouncements.openForm()"><span class="material-symbols-outlined">add</span>สร้างประกาศ</button>
      </section>

      <section class="at-card">
        <div class="at-toolbar">
          <div class="an-filters" role="tablist" aria-label="สถานะ">
            <button type="button" class="at-chip admin-announce-filter-btn active" data-filter="all">ทั้งหมด <b data-count="all">0</b></button>
            <button type="button" class="at-chip admin-announce-filter-btn" data-filter="published">เผยแพร่แล้ว <b data-count="published">0</b></button>
            <button type="button" class="at-chip admin-announce-filter-btn" data-filter="draft">แบบร่าง <b data-count="draft">0</b></button>
            <button type="button" class="at-chip admin-announce-filter-btn" data-filter="archived">เก็บถาวร <b data-count="archived">0</b></button>
          </div>
          <label class="at-search">
            <span class="material-symbols-outlined">search</span>
            <input type="search" id="searchInput" placeholder="ค้นหาหัวข้อ / เนื้อหา" autocomplete="off" />
          </label>
          <button type="button" class="at-icon-btn" onclick="AdminAnnouncements.refresh()" title="รีเฟรช" aria-label="รีเฟรช"><span class="material-symbols-outlined">refresh</span></button>
        </div>

        <div class="at-state" id="announceLoading">กำลังโหลด...</div>
        <div class="at-table-wrap" id="announceTableWrap" style="display:none">
          <table class="at-table admin-announce-table">
            <thead>
              <tr>
                <th class="c-pin" aria-label="ปักหมุด"></th>
                <th>หัวข้อ</th>
                <th>หมวดหมู่</th>
                <th>สถานะ</th>
                <th>วันที่เผยแพร่</th>
                <th>ผู้สร้าง</th>
                <th class="c-act"></th>
              </tr>
            </thead>
            <tbody id="announceTableBody"></tbody>
          </table>
          <div class="at-state" id="announceEmpty" style="display:none">ไม่พบประกาศ</div>
        </div>
      </section>
    </main>

    <!-- สร้าง / แก้ไขประกาศ (id เดียวกับฝั่งการตลาด — ใช้ Adminannouncements.js ร่วมกัน) -->
    <div class="announce-form-overlay at-modal" id="announceFormOverlay" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="at-modal-box announce-form-modal" onclick="event.stopPropagation()">
        <div class="at-modal-head">
          <h3 id="formTitle">สร้างประกาศใหม่</h3>
          <button type="button" class="at-icon-btn" onclick="AdminAnnouncements.closeForm()" aria-label="ปิด"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div class="at-modal-body">
          <input type="hidden" id="formId" />
          <div class="at-form">
            <label class="at-field an-wide"><span>หัวข้อ <i>*</i></span><input type="text" id="formAnnounceTitle" maxlength="200" placeholder="ระบุหัวข้อประกาศ" /></label>
            <label class="at-field"><span>หมวดหมู่</span>
              <select id="formCategory">
                <option value="general">ทั่วไป</option>
                <option value="important">สำคัญ</option>
                <option value="update">อัปเดต</option>
                <option value="event">กิจกรรม</option>
              </select></label>
            <label class="at-field"><span>ลิงก์ภายนอก</span><input type="url" id="formLink" placeholder="https://..." /></label>
            <label class="at-field an-wide"><span>เนื้อหา</span><textarea id="formContent" rows="6" placeholder="เขียนเนื้อหาประกาศ..."></textarea></label>
            <label class="at-field"><span>รูปภาพหน้าปก <small>(ไม่เกิน 5MB)</small></span>
              <input type="file" id="formCoverImage" accept="image/*" onchange="AdminAnnouncements.previewCover(this)" /></label>
            <label class="at-field"><span>แนบไฟล์</span><input type="file" id="formAttachment" /></label>
            <img class="announce-cover-preview an-wide" id="coverPreview" alt="ตัวอย่างรูปหน้าปก" />
            <label class="an-pin an-wide">
              <input type="checkbox" id="formPinned" />
              <span class="material-symbols-outlined">push_pin</span>
              ปักหมุดไว้บนสุดของการ์ดประชาสัมพันธ์
            </label>
          </div>
        </div>
        <div class="at-modal-foot">
          <button type="button" class="at-btn-ghost" onclick="AdminAnnouncements.closeForm()">ยกเลิก</button>
          <button type="button" class="at-btn-ghost" id="btnDraft" onclick="AdminAnnouncements.save('draft')">บันทึกแบบร่าง</button>
          <button type="button" class="at-btn-primary" id="btnPublish" onclick="AdminAnnouncements.save('published')">เผยแพร่ประกาศ</button>
        </div>
      </div>
    </div>

    <div id="toastContainer"></div>

    <script src="/js/core/supabaseClient.js"></script>
    <script src="/js/core/userService.js"></script>
    <script src="/js/core/roleConfig.js"></script>
    <script src="/js/core/auth.js"></script>
    <script src="/js/pages/admin/Adminannouncements.js"></script>
    <script src="/js/pages/auth/role-theme.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        if (typeof RoleTheme !== "undefined") RoleTheme.init();
        // เมนู Admin
        try {
          const res = await fetch("/pages/components/nav-admin.html");
          if (res.ok) {
            document.getElementById("navContainer").innerHTML = await res.text();
            document.querySelectorAll("#navContainer .app-nav a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === location.pathname));
          }
        } catch (e) { console.warn("nav:", e); }
        // ชื่อผู้ใช้ + ออกจากระบบ
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          try { await supabaseClient.auth.signOut(); } catch (e) { /* ignore */ }
          location.href = "/pages/auth/login.html";
        });
        if (!window.currentUser?.id && typeof loadCurrentUser === "function") { try { await loadCurrentUser(); } catch (e) { /* ignore */ } }
        const u = window.currentUser || {};
        const name = u.display_name || u.full_name || u.username || u.email || "Admin";
        document.getElementById("userName").textContent = name;
        document.getElementById("userAvatar").textContent = String(name).trim().charAt(0).toUpperCase();
      });
    </script>
  </body>
</html>
